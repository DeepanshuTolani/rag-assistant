name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Tests use the hashing embedder + fake LLM, so no model download or API key is needed.
      - run: pip install flask requests pypdf numpy python-dotenv pytest ruff
      - run: ruff check .
      - run: pytest -q
        env:
          EMBEDDING_MODEL: hashing
