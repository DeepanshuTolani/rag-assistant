services:
  web:
    build: .
    ports: ["8000:8000"]
    env_file: .env            # secrets come from your local .env (git-ignored), never the image
    environment:
      LOG_DIR: /srv/logs
      COOKIE_SECURE: "0"      # set to 1 behind HTTPS
    volumes:
      - ./logs:/srv/logs      # structured request logs -> source of real latency numbers
    restart: unless-stopped
